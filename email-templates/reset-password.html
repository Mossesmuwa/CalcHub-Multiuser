<!-- 
  Paste this into: Supabase Dashboard -> Authentication -> Email Templates -> Reset Password
  Keep the {{ .ConfirmationURL }} tag exactly as is - Supabase fills that in automatically.
-->
<div style="font-family: 'Inter', Arial, sans-serif; background:#0B0D14; padding:40px 0;">
  <table width="100%" cellpadding="0" cellspacing="0" style="max-width:400px; margin:0 auto; background:#151823; border:1px solid #262B3D; border-radius:22px; padding:36px;">
    <tr>
      <td style="text-align:center;">
        <div style="width:44px; height:44px; margin:0 auto 16px; border-radius:12px; background:linear-gradient(135deg,#7C5CFF,#22D3EE); line-height:44px; color:white; font-weight:700; font-size:20px;">C</div>
        <h1 style="color:#F2F3F8; font-size:20px; margin:0 0 8px;">Reset your password</h1>
        <p style="color:#8B93A7; font-size:14px; margin:0 0 24px;">
          Someone requested a password reset for your CalcHub account. If this wasn't you, ignore this email.
        </p>
        <a href="{{ .ConfirmationURL }}" style="display:inline-block; padding:13px 28px; border-radius:10px; background:linear-gradient(135deg,#7C5CFF,#22D3EE); color:white; font-weight:600; font-size:14px; text-decoration:none;">
          Reset Password
        </a>
        <p style="color:#8B93A7; font-size:12px; margin-top:24px;">This link expires in 1 hour.</p>
      </td>
    </tr>
  </table>
</div>
